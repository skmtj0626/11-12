<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Spider Battle</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-family: sans-serif;
        }

        button {
            font-size: 14px;
            padding: 6px 12px;
            border: none;
            background-color: #27ae60;
            color: white;
            border-radius: 6px;
            margin-top: 6px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="hud">
        <p>クモ: <span id="spiderHpText">50</span></p>
        <progress id="spiderHpBar" max="50" value="50"></progress>
        <br>
        <p>あなた: <span id="myHpText">50</span></p>
        <progress id="myHpBar" max="50" value="50"></progress>
        <br>
        <button id="healButton">回復 (残り3回)</button>
    </div>
    
    <a-scene 
        embedded 
        arjs="sourceType: webcam"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable">

        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5">
                <a-gltf-model 
                    id="spider"
                    src="spider.glb" 
                    position="0 0 0" 
                    scale="0.3 0.3 0.3" 
                    rotation="-90 0 0"
                    animation-mixer>
                </a-gltf-model>

                <a-box 
                    class="clickable" 
                    position="0 0.5 0" 
                    scale="1.2 1.2 1.2" 
                    opacity="0" 
                    material="transparent: true">
                </a-box>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const spider = document.getElementById("spider");
        const spiderHpText = document.getElementById("spiderHpText");
        const spiderHpBar = document.getElementById("spiderHpBar");
        const myHpText = document.getElementById("myHpText");
        const myHpBar = document.getElementById("myHpBar");
        const hitBox = document.querySelector(".clickable");
        const healButton = document.getElementById("healButton");

        let spiderHp = 50;
        let myHp = 50;
        const myMaxHp = 50;
        let isMyTurn = true;
        let isDead = false;
        let healCount = 3;

        const hitSound = new Audio("hit.mp3");
        const missSound = new Audio("miss.mp3");
        const deathSound = new Audio("death.mp3");
        const enemySound = new Audio("enemy-attack.mp3");
        const healSound = new Audio("heal.mp3");

        let availableAnimations = {};

        spider.addEventListener("model-loaded", (evt) => {
            const gltfObj = evt.detail.model;
            if (gltfObj.animations && gltfObj.animations.length > 0) {
                gltfObj.animations.forEach((clip) => {
                    const name = clip.name;
                    availableAnimations[name.toLowerCase()] = name;
                });
            }
            playAnimationByKeyword("idle", true);
        });

        function playAnimationByKeyword(keyword, loop = true, clamp = false) {
            if (isDead && keyword !== "death") return;
            
            let targetClip = null;
            
            for (let key in availableAnimations) {
                if (key.includes(keyword)) {
                    targetClip = availableAnimations[key];
                    break;
                }
            }

            if (!targetClip && Object.keys(availableAnimations).length > 0) {
                targetClip = Object.values(availableAnimations)[0];
            }

            if (targetClip) {
                spider.setAttribute("animation-mixer", {
                    clip: targetClip,
                    loop: loop ? "repeat" : "once",
                    clampWhenFinished: clamp,
                    timeScale: 1
                });
            }
        }

        function spiderCounterAttack() {
            if (isDead || myHp <= 0 || spiderHp <= 0) return;

            playAnimationByKeyword("jump", false, true);

            setTimeout(() => {
                if (isDead || myHp <= 0 || spiderHp <= 0) return;

                playAnimationByKeyword("attack", false, true);
                enemySound.currentTime = 0;
                enemySound.play().catch(e => console.log("Audio play error:", e));

                let damage = Math.floor(Math.random() * 10 + 1);
                myHp -= damage;
                if (myHp < 0) myHp = 0;

                myHpText.textContent = myHp;
                myHpBar.value = myHp;

                if (myHp === 0) {
                    isDead = true;
                    hitBox.classList.remove("clickable");
                    healButton.disabled = true;
                    deathSound.currentTime = 0;
                    deathSound.play().catch(e => console.log("Audio play error:", e));
                    return;
                }

                setTimeout(() => {
                    if (!isDead && spiderHp > 0 && myHp > 0) {
                        playAnimationByKeyword("idle", true);
                    }
                    isMyTurn = true;
                }, 1000);

            }, 800);
        }

        function attack() {
            if (isDead || !isMyTurn || spiderHp <= 0 || myHp <= 0) {
                return;
            }

            if (Math.random() < 0.3) {
                missSound.currentTime = 0;
                missSound.play().catch(e => console.log("Audio play error:", e));
                return;
            }

            isMyTurn = false;

            let damage = Math.floor(Math.random() * 10) + 1;
            spiderHp -= damage;
            if (spiderHp < 0) spiderHp = 0;

            spiderHpText.textContent = spiderHp;
            spiderHpBar.value = spiderHp;

            hitSound.currentTime = 0;
            hitSound.play().catch(e => console.log("Audio play error:", e));

            if (spiderHp === 0) {
                isDead = true;
                playAnimationByKeyword("death", false, true);
                hitBox.classList.remove("clickable");
                healButton.disabled = true;
                
                deathSound.currentTime = 0;
                deathSound.play().catch(e => console.log("Audio play error:", e));
            } else {
                spiderCounterAttack();
            }
        }

        function heal() {
            if (isDead || !isMyTurn || healCount <= 0 || myHp <= 0 || spiderHp <= 0) {
                return;
            }

            myHp += 15;
            if (myHp > myMaxHp) myHp = myMaxHp;

            myHpText.textContent = myHp;
            myHpBar.value = myHp;

            healSound.currentTime = 0;
            healSound.play().catch(e => console.log("Audio play error:", e));

            healCount--;
            healButton.textContent = `回復 (残り${healCount}回)`;

            if (healCount <= 0) {
                healButton.disabled = true;
            }
        }

        hitBox.addEventListener("click", attack);
        healButton.addEventListener("click", heal);
    </script>
</body>

</html>
